name: Release

# Builds Windows installers (NSIS .exe + MSI) and attaches them to a GitHub Release.
#
#   git tag vX.Y.Z && git push origin vX.Y.Z
#   or: Actions → Release → Run workflow

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (must already exist), e.g. v2.4.0"
        required: true
        default: "v2.4.0"

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ── Required: Intel/AMD Windows installer ───────────────────────────
  release-x64:
    name: Build Windows x64 installer
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Enable VBScript (WiX / MSI)
        shell: powershell
        run: |
          $cap = Get-WindowsCapability -Online | Where-Object { $_.Name -like 'VBSCRIPT*' }
          if ($cap -and $cap.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $cap.Name
          } elseif (-not $cap) {
            dism /online /enable-feature /featurename:VBSCRIPT /all /norestart
          }

      - name: Configure signing (optional)
        id: signing
        shell: powershell
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $key = ""
          $pass = ""
          if ($env:RAW_KEY) { $key = $env:RAW_KEY.Trim() }
          if ($env:RAW_PASSWORD) { $pass = $env:RAW_PASSWORD.Trim() }
          if ($key.Length -gt 20) {
            echo "TAURI_SIGNING_PRIVATE_KEY<<EOF" >> $env:GITHUB_ENV
            echo $key >> $env:GITHUB_ENV
            echo "EOF" >> $env:GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF" >> $env:GITHUB_ENV
            echo $pass >> $env:GITHUB_ENV
            echo "EOF" >> $env:GITHUB_ENV
            echo "signed=true" >> $env:GITHUB_OUTPUT
            Set-Content tauri-ci-bundle.json '{"bundle":{"createUpdaterArtifacts":true}}' -NoNewline
            Write-Host "Signed build enabled"
          } else {
            echo "signed=false" >> $env:GITHUB_OUTPUT
            Set-Content tauri-ci-bundle.json '{"bundle":{"createUpdaterArtifacts":false}}' -NoNewline
            Write-Host "Building unsigned installers (no TAURI_SIGNING_* secrets)"
          }

      - name: Build + upload x64 installers to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG_NAME }}
          releaseName: "PROMAS ${{ env.TAG_NAME }}"
          releaseBody: |
            ## Install PROMAS

            Download a **setup installer** below — not “Source code”:

            - **Windows x64 (Intel/AMD):** `PROMAS_*_x64-setup.exe` or `*_x64_*.msi`
            - **Windows ARM64** (if present): `PROMAS_*_arm64-setup.exe`

            Double-click the `.exe` to install and run the app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ steps.signing.outputs.signed == 'true' }}
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi -c tauri-ci-bundle.json

      - name: Upload x64 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promas-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

  # ── Optional: ARM64 Windows installer ───────────────────────────────
  release-arm64:
    name: Build Windows ARM64 installer
    needs: release-x64
    permissions:
      contents: write
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Enable VBScript (WiX / MSI)
        shell: powershell
        run: |
          $cap = Get-WindowsCapability -Online | Where-Object { $_.Name -like 'VBSCRIPT*' }
          if ($cap -and $cap.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $cap.Name
          } elseif (-not $cap) {
            dism /online /enable-feature /featurename:VBSCRIPT /all /norestart
          }

      - name: Configure signing (optional)
        id: signing
        shell: powershell
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $key = ""
          $pass = ""
          if ($env:RAW_KEY) { $key = $env:RAW_KEY.Trim() }
          if ($env:RAW_PASSWORD) { $pass = $env:RAW_PASSWORD.Trim() }
          if ($key.Length -gt 20) {
            echo "TAURI_SIGNING_PRIVATE_KEY<<EOF" >> $env:GITHUB_ENV
            echo $key >> $env:GITHUB_ENV
            echo "EOF" >> $env:GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF" >> $env:GITHUB_ENV
            echo $pass >> $env:GITHUB_ENV
            echo "EOF" >> $env:GITHUB_ENV
            echo "signed=true" >> $env:GITHUB_OUTPUT
            Set-Content tauri-ci-bundle.json '{"bundle":{"createUpdaterArtifacts":true}}' -NoNewline
          } else {
            echo "signed=false" >> $env:GITHUB_OUTPUT
            Set-Content tauri-ci-bundle.json '{"bundle":{"createUpdaterArtifacts":false}}' -NoNewline
          }

      - name: Build + upload ARM64 installers to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG_NAME }}
          releaseName: "PROMAS ${{ env.TAG_NAME }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ steps.signing.outputs.signed == 'true' }}
          updaterJsonPreferNsis: true
          args: --target aarch64-pc-windows-msvc --bundles nsis,msi -c tauri-ci-bundle.json

      - name: Upload ARM64 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promas-windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30
